spring:
  application:
    name: jpa

  datasource:
    url:
      jdbc:mysql://localhost:3307/sql_depo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  hibernate:
    ddl-auto: update

server:
  port: 8081
